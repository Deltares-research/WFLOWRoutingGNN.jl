# ──────────────────────────────────────────────────────────────────────────────
# WflowRoutingGNN hyperparameter search configuration
#
# Relative paths are resolved relative to the directory containing this file.
# Launch a search with:
#   julia --project=<repo_root> scripts/hparsearch.jl experiments/template_hparsearch.toml
#
# The [data], [model], and [train] tables define the base configuration that is
# shared across all runs.  The [hparsearch] table defines which parameters are
# varied and what values to try.
#
# For each combination in the search space, [data].run_name is automatically
# suffixed with a zero-padded index (e.g. "template_hps_run_hps01") and all
# outputs are written to a separate subfolder under runs_dir.
#
# After each run, a summary CSV is (re)written to:
#   <runs_dir>/<run_name>_hps_results.csv
# If multi-seed repetitions are enabled, aggregate summaries are also written:
#   <runs_dir>/<run_name>_hps_summary.csv
#   <runs_dir>/<run_name>_hps_summary.toml
# Failed runs are listed in <runs_dir>/<run_name>_hps_failures.csv.
#
# Resume an interrupted search with `--resume`: finished cells (metrics.toml and
# output NetCDFs present, identical settings) are skipped and their rows rebuilt from
# disk; incomplete cells are rerun from scratch.
#   julia --project=<repo_root> scripts/hparsearch.jl --resume experiments/template_hparsearch.toml
# ──────────────────────────────────────────────────────────────────────────────

[data]
# Base name for this search; each run is named <run_name>_hpsXX
run_name         = "template_hps_run"

# Root directory for all run outputs (relative to this file's directory)
runs_dir         = "../runs"

# Path to the wflow model directory.
# Must contain staticmaps.nc and run_default/output.nc
wflow_model_path = "../wflow_model/wflow_test_full"

# Subdirectory inside wflow_model_path containing output.nc
output_run_dir = "run_default"

# Wflow output schema: "v1" (default) or a path to a schema TOML file.
wflow_schema = "v1"

# Fraction of sliding windows used for training
train_frac = 0.6

# Fraction of sliding windows used for validation (remainder → test)
val_frac   = 0.2


[model]
# Base model settings — individual values may be overridden by [hparsearch]
domain = "river"

hidden_dim = 64

nlayers = 3

mlp_layers = 1

enc_activation  = "swish"
proc_activation = "swish"

# Enforce the kinematic-wave mass balance (river domain only). When false,
# river_q and river_h are predicted independently by the decoder. Sweep this
# (see [hparsearch.search_space] below) to compare against the hard constraint.
enforce_mass_balance = true

# Mass-balance formulation: "theta_kinematic_wave" (default), "muskingum_continuity"
# (carried storage + reservoir backbone, q as continuity readout) or "none".
# mb_residual_bound bounds the learned residual of "muskingum_continuity".
mb_formulation = "theta_kinematic_wave"
mb_residual_bound = 0.5
# Bounds of the reservoir constant K = mu_h/mu_q of "muskingum_continuity", in
# multiples of dt (0 < mb_K_min_dt < mb_K_max_dt; defaults 0.05 / 100).
mb_K_min_dt = 0.05
mb_K_max_dt = 100.0
# Implicitness weight θ ∈ [0, 1] of the mass-balance time discretisation.
# θ=1 fully implicit (default), θ=0.5 Crank–Nicolson, θ=0 fully explicit.
# Lowering θ damps rollout h-overshoots (scales ∂h_norm/∂q_norm by θ).
# Sweep it via [hparsearch.search_space] below.
mb_theta = 1.0

# Feed two physics-derived features to the decoder (summed upstream discharge at
# t and a fully-explicit next-step depth estimate). Known at t, non-circular; the
# hard mass-balance output stays exact. Sweepable via [hparsearch.search_space].
mb_augment_decoder = false

# Optional synthetic static feature: append log1p(upstream_area) as an extra
# static input channel (river domain).
include_log_upstream_area = false

# Optional smooth non-negative floor for mass-balance depth update (river
# domain, enforce_mass_balance = true only). Default false preserves hard floor.
mb_smooth_h_floor = false

# Softness [m] of the smooth h-floor; used only when mb_smooth_h_floor = true.
mb_h_floor_softness = 0.05

# Optional lower bounds for per-node z-score std used in MB-invasive
# normalisation (train-split fit).
mb_sigma_h_floor = 0.0
mb_sigma_q_floor = 0.0
mb_sigma_inwater_floor = 0.0

# Scale the denormalised lateral inflow back to m3/s inside the mass-balance
# layer (see template.toml). false reproduces pre-fix runs.
mb_inwater_unscale = true


[train]
# Base training settings — individual values may be overridden by [hparsearch]
epochs = 50

batch_size = 8

# Peak LR of the first curriculum phase (see template.toml for schedule details)
lr_start = 1e-3
# Schedule floor each phase decays toward (option-1 heuristic: lr_start / 100)
lr_final = 1e-5
# Linear warmup epochs at the start of every phase
lr_warmup_epochs = 1
# Geometric shrink of each successive phase peak (gentle ≈ 0.8 for Adam)
lr_peak_decay = 0.8
# Deprecated: ignored by the curriculum warm-restart schedule
lr_steps = 10

device = "cpu"

# Fixed-horizon validation metric / early stopping / checkpointing.
# See experiments/template.toml for full documentation of these keys.
eval_horizon = 30
eval_anchors = 32
early_stopping = false
early_stopping_patience = 20
checkpoint_every = 0
checkpoint_full_eval = false

[train.strategy]
steps       = [1, 2, 4]
durations   = [15, 15, 20]
noise_scale = 0.0
pushforward_tf_weight = 0.0

[eval]
upstream_points = 5
# Subcatchment error attribution (<split>_subcatch_* maps/CSVs) per run, with the
# permutation ranking of attributes. Both default to true; a large search can turn
# them off (or sweep "eval.subcatch_attribution") to save analysis time.
subcatch_attribution = true
subcatch_rank = true


# ──────────────────────────────────────────────────────────────────────────────
# Hyperparameter search settings
# ──────────────────────────────────────────────────────────────────────────────

[hparsearch]
# Search strategy.  Currently only "box" is supported, which evaluates every
# Cartesian-product combination of the values in search_space.
search_type = "box"

# Keep going when a run fails (logged, listed in *_hps_failures.csv). Default true;
# false aborts the search at the first failure.
# continue_on_error = true

# Optional run repetition controls (choose exactly one):
# - repetitions = N  → run each combination N times with seeds 1..N
# - seeds = [..]     → run each combination once per explicit seed
# If neither is set, each combination runs once with default (unseeded) RNG.
# repetitions = 3
# seeds = [11, 29, 47]

[hparsearch.search_space]
# Each key is a dot-separated path into the [data] / [model] / [train] tables
# above.  Each value is the list of settings to try.

# Architecture size
"model.hidden_dim" = [32, 64, 128]
"model.nlayers"    = [2, 3]
"model.mlp_layers" = [1, 2]

# Mass balance: compare the hard kinematic-wave constraint (true) against
# independent river_q / river_h prediction (false).
"model.enforce_mass_balance" = [true, false]

# Mass-balance implicitness weight θ. Sweep to trade rollout stability
# (lower θ, less h-overshoot) against storage-response lag.
"model.mb_theta" = [1.0, 0.5, 0.25]

# A/B of the mass-balance formulation: the legacy q-state kinematic wave versus
# the reservoir-backbone + continuity-readout hybrid (mb_theta only affects the former).
"model.mb_formulation" = ["theta_kinematic_wave", "muskingum_continuity"]
# Optional (muskingum_continuity only): floor / ceiling of the reservoir constant
# K = mu_h/mu_q in multiples of dt (defaults 0.05 / 100). Raising the floor lets the
# backbone hold a peak h in flashy small-K cells (floor contraction 1/(1 + 1/K_min_dt)).
# "model.mb_K_min_dt" = [0.05, 0.2, 0.5]
# "model.mb_K_max_dt" = [20.0, 100.0]
# Physics-augmented decoder inputs (upstream-Q sum + explicit depth estimate).
"model.mb_augment_decoder" = [false, true]

# Optional upstream-area context feature.
"model.include_log_upstream_area" = [false, true]

# Optional smooth depth floor and softness sweep (enable together).
# "model.mb_smooth_h_floor" = [false, true]
# "model.mb_h_floor_softness" = [0.02, 0.05, 0.1]

# Optional nonlinear encoder-input scaling of a time-varying variable
# (zscore | log1p_zscore | signed_log_zscore | asinh_zscore). The table is
# created on demand; only the encoder sees the transform (mass balance unchanged).
# river_inwater is the first candidate (heavy-tailed, area-normalised).
# "model.normalization.river_inwater" = ["zscore", "log1p_zscore", "asinh_zscore"]

# Optional per-node std-floor sweep for MB-invasive hardening.
# "model.mb_sigma_h_floor" = [0.0, 0.5, 1.0]
# "model.mb_sigma_q_floor" = [0.0]
# "model.mb_sigma_inwater_floor" = [0.0]

# Learning rate
"train.lr_start" = [1e-3, 5e-4]

# Rollout-gradient mode and optional pushforward teacher-forced blend.
# `train.strategy.pushforward_tf_weight` is only used when mode is pushforward.
# Keep 0.0 for other modes.
"train.rollout_grad" = ["full_bptt", "pushforward", "detached"]
"train.strategy.pushforward_tf_weight" = [0.0, 0.25, 0.5, 0.75]

# Training strategy — vary the entire schedule as an array of dicts so that
# steps and durations are always kept consistent with each other.
# (Comment out the two scalar keys above and uncomment this block to use it.)
# "train.strategy" = [
#     {steps = [1],       durations = [50],         noise_scale = 0.0},
#     {steps = [1, 2],    durations = [25, 25],      noise_scale = 0.0},
#     {steps = [1, 2, 4], durations = [15, 15, 20],  noise_scale = 0.0},
# ]
