# ──────────────────────────────────────────────────────────────────────────────
# WflowRoutingGNN experiment configuration
#
# Relative paths are resolved relative to the directory containing this file.
# Launch a training run with:
#   julia --project=<repo_root> scripts/train.jl experiments/template.toml
# ──────────────────────────────────────────────────────────────────────────────

[data]
# Name of this run; output is saved to <runs_dir>/<run_name>/
run_name         = "template_run"

# Root directory for all run outputs (relative to this file's directory)
runs_dir         = "../runs"

# Path to the wflow model directory.
# Must contain staticmaps.nc and run_default/output.nc
wflow_model_path = "../wflow_model/wflow_test_full"

# Subdirectory inside wflow_model_path containing output.nc
output_run_dir = "run_default"

# Wflow output schema: "v1" (default) or a path to a schema TOML file.
# Change this when using a different wflow version whose variable names differ.
wflow_schema = "v1"

# Fraction of sliding windows used for training (remainder → test)
train_frac = 0.6

# Fraction of sliding windows used for validation (remainder → test)
val_frac   = 0.2


[model]
# Routing domain: "river", "land", or "subsurface"
domain = "river"

# Width of all hidden layers
hidden_dim = 64

# Number of message-passing layers in the processor
nlayers = 3

# Number of Dense layers in the encoder and decoder MLPs (1 = single layer)
mlp_layers = 1

# Activation function for the encoder MLP
# Options: "relu", "sigmoid", "tanh", "swish", "identity"
enc_activation  = "swish"

# Activation function for the processor GNN layers
proc_activation = "swish"


[train]
# Total number of training epochs
epochs = 50

# Number of horizon windows per mini-batch
batch_size = 8

# Peak learning rate of the FIRST curriculum phase.  The schedule is a
# curriculum-aligned cosine warm-restart: each phase warms up from lr_final to
# its peak, then cosine-decays back toward lr_final.  Tune with the LR range
# test (scripts/lr_range_test.jl) or let scripts/autotune_train.jl set it.
lr_start = 1e-3

# Schedule floor: the lowest learning rate each phase decays toward, and the
# floor for later (decayed) phase peaks.  Option-1 heuristic: lr_start / 100.
lr_final = 1e-5

# Number of warmup epochs at the start of every phase (linear ramp from
# lr_final up to that phase's peak).
lr_warmup_epochs = 1

# Geometric shrink applied to each successive phase peak:
#   peak(phase p) = max(lr_start * lr_peak_decay^(p-1), lr_final)
# Since Adam is largely invariant to gradient magnitude, a gentle decay (~0.8)
# is usually enough as the rollout horizon grows.
lr_peak_decay = 0.8

# Deprecated: retained for backward-compatibility only; the curriculum
# warm-restart schedule ignores this field.
lr_steps = 10

# Compute device: "cpu" or "gpu"
device = "cpu"

# Training curriculum: rollout length is increased from steps[1] to steps[end]
# over successive phases.  Each phase lasts durations[i] epochs.
# lengths of steps and durations must match.
[train.strategy]
steps       = [1, 2, 4]
durations   = [15, 15, 20]

# Standard deviation of Gaussian noise injected into state/forcing inputs
# during rollout steps (0.0 to disable)
noise_scale = 0.0
