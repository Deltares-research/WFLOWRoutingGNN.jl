# ──────────────────────────────────────────────────────────────────────────────
# WflowRoutingGNN experiment configuration
#
# Relative paths are resolved relative to the directory containing this file.
# Launch a training run with:
#   julia --project=<repo_root> scripts/train.jl experiments/template.toml
# ──────────────────────────────────────────────────────────────────────────────

[data]
# Name of this run; output is saved to <runs_dir>/<run_name>/
run_name         = "template_run"

# Root directory for all run outputs (relative to this file's directory)
runs_dir         = "../runs"

# Path to the wflow model directory.
# Must contain staticmaps.nc and run_default/output.nc
wflow_model_path = "../wflow_model/wflow_test_full"

# Subdirectory inside wflow_model_path containing output.nc
output_run_dir = "run_default"

# Wflow output schema: "v1" (default) or a path to a schema TOML file.
# Change this when using a different wflow version whose variable names differ.
wflow_schema = "v1"

# Fraction of sliding windows used for training (remainder → test)
train_frac = 0.6

# Fraction of sliding windows used for validation (remainder → test)
val_frac   = 0.2


[model]
# Routing domain: "river", "land", or "subsurface"
domain = "river"

# Width of all hidden layers
hidden_dim = 64

# Number of message-passing layers in the processor
nlayers = 3

# Number of Dense layers in the encoder and decoder MLPs (1 = single layer)
mlp_layers = 1

# Activation function for the encoder MLP
# Options: "relu", "sigmoid", "tanh", "swish", "identity"
enc_activation  = "swish"

# Activation function for the processor GNN layers
proc_activation = "swish"

# Enforce the kinematic-wave mass balance as a hard constraint (river domain only).
# When true (default) the decoder predicts only the discharge increment Δq and
# river_h is derived analytically from the mass balance. When false, river_q and
# river_h are predicted independently by the decoder (no physical coupling) —
# useful as a baseline to measure the benefit of the mass-balance constraint.
enforce_mass_balance = true

# Implicitness weight θ ∈ [0, 1] of the mass-balance time discretisation
# (river domain, enforce_mass_balance = true only).
#   θ = 1.0  fully implicit / backward Euler (default; historical behaviour)
#   θ = 0.5  Crank–Nicolson
#   θ = 0.0  fully explicit / forward Euler
# h[t+1] uses θ·flux(t+1) + (1−θ)·flux(t). Lowering θ scales the stiff
# q→h gradient (∂h_norm/∂q_norm = −θ·dt·σ_q/σ_h) by θ, damping the rollout
# h-overshoots at the cost of a small temporal lag in the storage response.
# See docs/mass_balance_stability_notes.md.
mb_theta = 1.0

# Feed two physics-derived features to the decoder (river domain,
# enforce_mass_balance = true only): the summed upstream discharge at t and a
# fully-explicit (forward-Euler) estimate of the next-step depth. Both are known
# at t (non-circular) and give the decoder a physics warm-start; the hard
# mass-balance output stays exact. Widens the decoder's first layer by 2 inputs.
mb_augment_decoder = false


[train]
# Total number of training epochs
epochs = 50

# Number of horizon windows per mini-batch
batch_size = 8

# Peak learning rate of the FIRST curriculum phase.  The schedule is a
# curriculum-aligned cosine warm-restart: each phase warms up from lr_final to
# its peak, then cosine-decays back toward lr_final.  Tune with the LR range
# test (scripts/lr_range_test.jl) or let scripts/autotune_train.jl set it.
lr_start = 1e-3

# Schedule floor: the lowest learning rate each phase decays toward, and the
# floor for later (decayed) phase peaks.  Option-1 heuristic: lr_start / 100.
lr_final = 1e-5

# Number of warmup epochs at the start of every phase (linear ramp from
# lr_final up to that phase's peak).
lr_warmup_epochs = 1

# Geometric shrink applied to each successive phase peak:
#   peak(phase p) = max(lr_start * lr_peak_decay^(p-1), lr_final)
# Since Adam is largely invariant to gradient magnitude, a gentle decay (~0.8)
# is usually enough as the rollout horizon grows.
lr_peak_decay = 0.8

# Deprecated: retained for backward-compatibility only; the curriculum
# warm-restart schedule ignores this field.
lr_steps = 10

# Global gradient-L2-norm clip applied before each optimiser step (0 disables).
# A safety net for curriculum-phase restarts where a newly deepened BPTT graph
# can produce a transient gradient spike.
grad_clip = 1.0

# How the water-depth (h) term of the loss is normalised (river domain only):
#   "absolute"  - weight sigma_h/(dt*sigma_q); balances the q- and h-loss
#                 magnitudes (default; historical behaviour).
#   "increment" - weight (sigma_h/(dt*sigma_q))^2; measures h-error on the
#                 mass-balance increment scale (dt*sigma_q) so d(h_norm)/d(q_norm)
#                 ~ O(1). Removes the stiff gradient amplification of the hard
#                 mass-balance decoder, at the cost of weaker h-supervision once
#                 discharge is well fit.
h_loss_scale = "absolute"

# Runtime per-phase adaptive LR backoff (curriculum warm restarts). Must be in
# (0, 1]; 1.0 disables. When an epoch is flagged unstable (non-finite gradient,
# skipped batches, or a grad-norm spike far above the phase's running median),
# the current phase's LR is multiplied by this factor for the rest of the phase,
# then reset at the next phase boundary. Reacts to a destabilised deepened
# rollout that an offline (untrained) range test cannot foresee.
phase_backoff_factor = 0.5

# Compute device: "cpu" or "gpu"
device = "cpu"

# --- Fixed-horizon validation metric, early stopping & checkpointing ----------
# Each epoch, a constant-length autoregressive rollout is run from many anchor
# start points in the validation split. Unlike the curriculum `val_rollout`
# (whose horizon grows across phases and is therefore not comparable), this
# fixed-horizon metric is directly comparable epoch-to-epoch and is what early
# stopping uses. Two numbers are logged: the discharge RMSE (physical units) and
# the peak ratio max|q_pred|/max|q_truth|.
#
# eval_horizon : rollout length in steps for the fixed-horizon metric.
#                0 disables the metric (and therefore early stopping). If the
#                validation split is shorter than eval_horizon+1 it is clamped.
eval_horizon = 30
# eval_anchors : number of evenly-spaced start points batched into the metric.
eval_anchors = 32

# early_stopping : stop once the fixed-horizon discharge RMSE has not improved
#                  for `early_stopping_patience` epochs; the best-metric weights
#                  are restored so the saved model is the best epoch. Requires
#                  eval_horizon > 0.
early_stopping = false
early_stopping_patience = 20

# checkpoint_every : save a model checkpoint every N epochs into
#                    <run_dir>/checkpoints/epoch_NNNN/. 0 disables.
checkpoint_every = 0
# checkpoint_full_eval : when true, run the same full end-of-training evaluation
#                        (trajectory rollout, plots, NetCDF, movie) for each
#                        checkpoint, written alongside its weights.
checkpoint_full_eval = false

# Training curriculum: rollout length is increased from steps[1] to steps[end]
# over successive phases.  Each phase lasts durations[i] epochs.
# lengths of steps and durations must match.
[train.strategy]
steps       = [1, 2, 4]
durations   = [15, 15, 20]

# Standard deviation of Gaussian noise injected into state/forcing inputs
# during rollout steps (0.0 to disable)
noise_scale = 0.0
